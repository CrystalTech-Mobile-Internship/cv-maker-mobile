<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Smart CV Maker - tạo, chỉnh sửa và xuất CV A4 ngay trên trình duyệt.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Smart CV Maker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Smart CV Maker</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Some embedded and in-app browsers block network access inside shared
    // workers. The app checks this once to pick a compatible local storage.
    window.cvCanUseDatabaseWorker = function () {
      return new Promise(function (resolve) {
        try {
          if (typeof SharedWorker === 'undefined') { resolve(false); return; }
          var target = new URL('sqlite3.wasm', document.baseURI).href;
          var code = "onconnect=function(e){var p=e.ports[0];" +
            "fetch(" + JSON.stringify(target) + ",{method:'HEAD'})" +
            ".then(function(r){p.postMessage(r.ok)})" +
            ".catch(function(){p.postMessage(false)});};";
          var url = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
          var worker = new SharedWorker(url);
          var timer = setTimeout(function () { resolve(false); }, 3000);
          worker.port.onmessage = function (event) {
            clearTimeout(timer);
            resolve(event.data === true);
          };
          worker.port.start();
        } catch (error) {
          resolve(false);
        }
      });
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
